<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Система · Дашборд</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cg fill='none' stroke='%232ea043' stroke-width='2' stroke-linecap='round'%3E%3Crect x='3' y='14' width='18' height='7' rx='2'/%3E%3Cpath d='M7 17.5h.01M10.5 17.5h.01M17 14V8'/%3E%3Cpath d='M14.5 5.5a3.5 3.5 0 0 1 5 0M12.5 3a6.5 6.5 0 0 1 9 0'/%3E%3C/g%3E%3C/svg%3E">
<meta name="theme-color" content="#0b0d10">
<style>
:root{
  --bg:#0b0d10; --card:#14171b; --line:#23282e;
  --label:#79828c; --value:#e8edf2; --dim:#9aa4ae;
  --ok:#3fb950; --warn:#e3b341; --crit:#f85149;
  --mono:"JetBrains Mono","Cascadia Mono",Consolas,"Courier New",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{height:100%}
body{
  background:var(--bg);
  background-image:radial-gradient(1100px 550px at 20% -10%,#12161b 0%,var(--bg) 65%);
  color:var(--value);font-family:var(--mono);
  display:flex;align-items:flex-start;justify-content:flex-start;
  min-height:100%;padding:28px;
}
.wrap{width:100%;max-width:1200px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:10px;background:#1b2026;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;flex:none}
header h1{font-size:17px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
nav{display:flex;gap:6px;margin-left:14px}
nav a{color:var(--dim);font-size:12px;text-decoration:none;border:1px solid var(--line);
  border-radius:8px;padding:4px 10px}
nav a:hover{color:var(--value);border-color:var(--dim)}
nav a.on{color:var(--value);border-color:var(--dim);background:#1a1f25}
.clock{margin-right:auto;display:flex;align-items:center;gap:9px;color:var(--dim);font-size:14px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);
  animation:pulse 2s ease-in-out infinite}
.dot.err{background:var(--crit);box-shadow:0 0 10px var(--crit);animation:none}
@keyframes pulse{50%{opacity:.35}}
.label{color:var(--label);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.val{font-size:15px;text-align:right;line-height:1.5}
.val .dim{color:var(--dim)}
.chip{display:inline-block;background:#1a1f25;border:1px solid var(--line);border-radius:9px;
  padding:3px 9px;font-size:11.5px;color:var(--dim)}
.chip b{font-weight:600;margin-left:6px;color:var(--value)}
.chip b.ok{color:var(--ok)} .chip b.warn{color:var(--warn)} .chip b.crit{color:var(--crit)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px;
  display:flex;flex-direction:column;align-items:center;gap:4px}
.tile .label{font-size:11px}
.gwrap{position:relative;width:118px;height:118px}
.gwrap svg{width:100%;height:100%}
.gval{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gval b{font-size:26px;font-weight:700}
.gval span{font-size:11px;color:var(--dim);margin-top:2px;text-align:center;line-height:1.3}
.big{font-size:34px;font-weight:700;line-height:1.15;padding:26px 0 10px}
.big small{font-size:16px;color:var(--dim);font-weight:400}
.ok{color:var(--ok)} .warn{color:var(--warn)} .crit{color:var(--crit)}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.info div{background:var(--card);padding:11px 16px}
.info .label{font-size:10.5px}
.info .val{text-align:left;font-size:13.5px;margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .opkg-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.info .opkg-top .label{margin:0}
.info .opkg-top .chips{margin:0}
.info .opkg-val{text-align:right}
.chartcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px 10px}
.chead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.chead .ct{font-size:13px;font-weight:700;letter-spacing:.06em}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--dim)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.legend b{color:var(--value);font-weight:600;margin-left:4px}
.legend span{cursor:pointer;user-select:none;-webkit-user-select:none;transition:opacity .15s}
.legend span:hover{color:var(--value)}
.legend span.off{opacity:.4;text-decoration:line-through}
.lggrp{color:var(--label);font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.lggrp:hover{color:var(--value)}
.lghint{font-size:10px;color:#525b64;letter-spacing:.04em;white-space:nowrap}
.wbtns{margin-left:auto;display:flex;gap:6px}
.wbtn{background:#1a1f25;border:1px solid var(--line);border-radius:8px;color:var(--dim);
  font-family:var(--mono);font-size:11.5px;padding:4px 10px;cursor:pointer}
.wbtn.on{color:var(--value);border-color:var(--dim)}
canvas{width:100%;height:280px;display:block;cursor:crosshair}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3fb950"
           stroke-width="2" stroke-linecap="round">
        <rect x="2" y="14" width="20" height="7" rx="2"/>
        <path d="M6.5 17.5h.01M10 17.5h.01M17 14V8"/>
        <path d="M14.5 5.5a3.5 3.5 0 0 1 5 0M12.5 3a6.5 6.5 0 0 1 9 0"/>
      </svg>
    </div>
    <h1>Система</h1>
    <nav><a href="index.html">карточка</a><a href="dash.html" class="on">дашборд</a></nav>
  </header>
    <div class="clock"><span class="dot" id="dot"></span><span id="datetime">--.--.---- --:--:--</span></div>

  <div class="tiles">
    <div class="tile"><span class="label">CPU Load</span>
      <div class="gwrap">
        <svg viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="52" fill="none" stroke="#22272d" stroke-width="10"/>
          <circle id="g_cpu" cx="60" cy="60" r="52" fill="none" stroke="#4cc38a" stroke-width="10"
                  stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7"
                  transform="rotate(-90 60 60)"/>
        </svg>
        <div class="gval"><b id="v_cpu">–</b><span>загрузка</span></div>
      </div>
    </div>
    <div class="tile"><span class="label">Память</span>
      <div class="gwrap">
        <svg viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="52" fill="none" stroke="#22272d" stroke-width="10"/>
          <circle id="g_ram" cx="60" cy="60" r="52" fill="none" stroke="#f5a623" stroke-width="10"
                  stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7"
                  transform="rotate(-90 60 60)"/>
        </svg>
        <div class="gval"><b id="v_ram">–</b><span id="s_ram">RAM</span></div>
      </div>
    </div>
    <div class="tile"><span class="label">CPU темп.</span><div class="big" id="v_tcpu">–</div></div>
    <div class="tile"><span class="label">2.4G темп.</span><div class="big" id="v_t24">–</div></div>
    <div class="tile"><span class="label">5G темп.</span><div class="big" id="v_t5">–</div></div>
  </div>

  <div class="info">
    <div><div class="label">Модель</div><div class="val" id="i_model">…</div></div>
    <div><div class="label">ОС</div><div class="val" id="i_os">…</div></div>
    <div><div class="label">CPU</div><div class="val" id="i_cpu">…</div></div>
        <div style="display: flex; flex-direction: column; justify-content: space-between; height: 100%;">
                <!-- Первая строка: OPKG слева, Слот справа -->
                <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                        <span class="label" style="margin: 0;">OPKG</span>
                        <span class="chips" id="i_slotwrap" style="margin: 0;">
                                <span class="chip">Слот <b id="i_slot">-</b></span>
                        </span>
                </div>
                <!-- Вторая строка: Значение справа с обнуленными отступами -->
                <div class="val opkg-val" id="i_opkg" style="text-align: right; margin: 0; padding-top: 4px; line-height: 1.2;">...</div>
        </div>
    <div><div class="label">Uptime</div><div class="val" id="i_up">…</div></div>
  </div>

  <div class="chartcard">
    <div class="chead">
      <span class="ct">ДИНАМИКА · % / °C / Мбит/с</span>
      <span class="legend">
        <span class="lggrp" data-g="cpu" title="клик — показать/скрыть раздел · двойной клик — только этот раздел">ЦПУ:</span>
        <span data-k="cpu" title="клик — показать/скрыть · двойной клик — только эта кривая"><i style="background:#4cc38a"></i>CPU<b id="lg_cpu">–</b></span>
        <span class="lggrp" data-g="ram" title="клик — показать/скрыть раздел · двойной клик — только этот раздел">RAM:</span>
        <span data-k="ram" title="клик — показать/скрыть · двойной клик — только эта кривая"><i style="background:#f5a623"></i>RAM<b id="lg_ram">–</b></span>
        <span class="lggrp" data-g="temp" title="клик — показать/скрыть раздел · двойной клик — только этот раздел">Темп.:</span>
        <span data-k="tcpu" title="клик — показать/скрыть · двойной клик — только эта кривая"><i style="background:#e06c75"></i>CPU°<b id="lg_tcpu">–</b></span>
        <span data-k="t24" title="клик — показать/скрыть · двойной клик — только эта кривая"><i style="background:#56b6c2"></i>2.4G°<b id="lg_t24">–</b></span>
        <span data-k="t5" title="клик — показать/скрыть · двойной клик — только эта кривая"><i style="background:#c678dd"></i>5G°<b id="lg_t5">–</b></span>
        <span class="lggrp" data-g="net" title="клик — показать/скрыть раздел · двойной клик — только этот раздел">Сеть:</span>
        <span data-k="rx" title="клик — показать/скрыть · двойной клик — только эта кривая"><i style="background:#4d9fff"></i>RX<b id="lg_rx">–</b></span>
        <span data-k="tx" title="клик — показать/скрыть · двойной клик — только эта кривая"><i style="background:#f778ba"></i>TX<b id="lg_tx">–</b></span>
      </span>
      <span class="lghint">клик — вкл/выкл · двойной — только выбранное</span>
      <span class="wbtns">
        <button class="wbtn on" data-w="5">5 мин</button>
        <button class="wbtn" data-w="30">30 мин</button>
        <button class="wbtn" data-w="180">3 ч</button>
      </span>
    </div>
    <canvas id="chart"></canvas>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const p2=n=>String(n).padStart(2,'0');
const pi=v=>{const n=parseInt(v,10);return isNaN(n)?null:n};
const C=326.7, MAX=3600, K='sysinfoHistV1';
const SERIES=[
  {k:'cpu', c:'#4cc38a', l:'CPU'},
  {k:'ram', c:'#f5a623', l:'RAM'},
  {k:'tcpu',c:'#e06c75', l:'CPU°'},
  {k:'t24', c:'#56b6c2', l:'2.4G°'},
  {k:'t5',  c:'#c678dd', l:'5G°'}
];
// Скорости сети (Мбит/с) — отдельная правая шкала, не проценты
const SPEED=[
  {k:'rx', c:'#4d9fff', l:'RX'},
  {k:'tx', c:'#f778ba', l:'TX'}
];
const ALL=SERIES.concat(SPEED);
const fmtSpd=v=>v==null?'–':(v<10?v.toFixed(1):Math.round(v))+' Мбит/с';
let WIN=5, points=[], pushN=0, hoverX=null, serverTime=null, raf=0;
try{points=JSON.parse(localStorage.getItem(K))||[]}catch(e){points=[]}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(points))}catch(e){}};
addEventListener('beforeunload',save);

// Видимость кривых: клик по легенде — вкл/выкл (кривая или целый раздел),
// двойной клик — оставить только выбранное (ещё раз — вернуть все).
// Выбор запоминается в localStorage и переживает перезагрузку страницы.
const VK='sysinfoVisV1';
let vis={};
try{vis=JSON.parse(localStorage.getItem(VK))||{}}catch(e){vis={}}
ALL.forEach(s=>{if(vis[s.k]==null)vis[s.k]=true});
const saveVis=()=>{try{localStorage.setItem(VK,JSON.stringify(vis))}catch(e){}};
const lgEls={};
// Разделы легенды: ЦПУ / RAM / Температура / Сеть
const GROUPS={cpu:['cpu'],ram:['ram'],temp:['tcpu','t24','t5'],net:['rx','tx']};
const grpEls={};

// История с роутера: один раз при открытии тянем /tmp/sysinfo-history.json
// (построчный JSON: одна строка = одна точка). Тогда график одинаков
// на всех устройствах и не зависит от кеша браузера.
async function loadHist(){
  try{
    const r=await fetch('sysinfo-history.json?'+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    const txt=await r.text();
    const arr=[];
    for(const ln of txt.split('\n')){
      if(!ln.trim())continue;
      try{const o=JSON.parse(ln);
        arr.push({ts:o.ts*1000,cpu:o.cpu,ram:o.ram,tcpu:o.tcpu,t24:o.t24,t5:o.t5,
                  rx:o.rx==null?null:o.rx,tx:o.tx==null?null:o.tx});
      }catch(e){}
    }
    if(arr.length>10){
      // Часы роутера могут отличаться от часов браузера — сдвигаем на разницу
      const off=Date.now()-arr[arr.length-1].ts;
      points=arr.map(p=>({ts:p.ts+off,cpu:p.cpu,ram:p.ram,tcpu:p.tcpu,t24:p.t24,t5:p.t5,rx:p.rx,tx:p.tx}));
      save(); schedule();
    }
  }catch(e){}
}

// Возврат на вкладку после отсутствия: браузер в фоне замедляет таймеры
// (точки копятся редко), поэтому перезабираем историю с роутера — график
// снова становится точным, без F5.
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();}
  else if(hiddenAt&&Date.now()-hiddenAt>30000){hiddenAt=0;loadHist();}
});

const fmtDT=d=>p2(d.getDate())+'.'+p2(d.getMonth()+1)+'.'+d.getFullYear()+' '
                   +p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds());
function parseDT(s){
  const [dd,mm,yy]=s.slice(0,10).split('.').map(Number);
  const [h,mi,se]=s.slice(11).split(':').map(Number);
  return new Date(yy,mm-1,dd,h,mi,se);
}
setInterval(()=>{if(serverTime){serverTime=new Date(serverTime.getTime()+1000);
  $('datetime').textContent=fmtDT(serverTime);}},1000);

const cls=v=>v>=80?'crit':v>=65?'warn':'ok';
function gauge(id,pct){$(id).style.strokeDashoffset=C*(1-Math.min(100,pct)/100);}
function setBig(id,v){const el=$(id);
  if(v==null){el.textContent='–';el.className='big';return;}
  el.innerHTML=v+'<small>°C</small>'; el.className='big '+cls(v);}

const cv=$('chart'), ctx=cv.getContext('2d');
const schedule=()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;draw();})};
function draw(){
  const dpr=devicePixelRatio||1, w=cv.clientWidth, h=cv.clientHeight;
  if(cv.width!==w*dpr){cv.width=w*dpr;cv.height=h*dpr;}
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
  const L=34,T=8,B=22, now=Date.now(), span=WIN*60000, t0=now-span;
  const pts=points.filter(p=>p.ts>=t0);

  // Правая шкала скоростей: авто-масштаб по «красивому» максимуму окна
  let SMAX=0;
  for(const p of pts){ if(vis.rx&&p.rx!=null&&p.rx>SMAX)SMAX=p.rx;
                       if(vis.tx&&p.tx!=null&&p.tx>SMAX)SMAX=p.tx; }
  let SN=0;
  if(SMAX>0){ const base=Math.pow(10,Math.floor(Math.log10(SMAX)));
    for(const m of [1,2,3,5,10]){ if(m*base>=SMAX){SN=m*base;break;} } }
  const R=SN>0?64:8;
  const X=t=>L+(t-t0)/span*(w-L-R), Y=v=>T+(1-v/100)*(h-T-B);
  const Ys=v=>T+(1-v/SN)*(h-T-B);

  ctx.font='10px monospace'; ctx.textAlign='right'; ctx.textBaseline='middle';
  for(let v=0;v<=100;v+=20){
    ctx.strokeStyle=v?'#1c2126':'#2a3037'; ctx.beginPath();
    ctx.moveTo(L,Y(v)); ctx.lineTo(w-R,Y(v)); ctx.stroke();
    ctx.fillStyle='#525b64'; ctx.fillText(v,L-6,Y(v));
  }
  // Подписи Мбит/с справа: короткие засечки у края, без линий поперёк
  if(SN>0){
    ctx.textAlign='left';
    for(let i=0;i<=4;i++){ const v=SN*i/4;
      ctx.strokeStyle='#242a31'; ctx.beginPath();
      ctx.moveTo(w-R,Ys(v)); ctx.lineTo(w-R+4,Ys(v)); ctx.stroke();
      ctx.fillStyle='#3d4650';
      ctx.fillText((v<10?v.toFixed(1):Math.round(v))+(i===4?' Мбит/с':''), w-R+7, Ys(v));
    }
  }
  ctx.textAlign='center'; ctx.textBaseline='top';
  for(let i=0;i<=4;i++){
    const t=t0+span*i/4, d=new Date(t);
    ctx.fillStyle='#525b64';
    ctx.fillText(WIN<=5?p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds())
                          :p2(d.getHours())+':'+p2(d.getMinutes()), X(t), h-B+6);
  }
  for(const s of SERIES){
    if(!vis[s.k])continue;
    ctx.strokeStyle=s.c; ctx.lineWidth=1.6; ctx.beginPath(); let on=false;
    for(const p of pts){ const v=p[s.k];
      if(v==null){on=false;continue;}
      on?ctx.lineTo(X(p.ts),Y(v)):(ctx.moveTo(X(p.ts),Y(v)),on=true);
    }
    ctx.stroke();
  }
  if(SN>0){ for(const s of SPEED){
    if(!vis[s.k])continue;
    ctx.strokeStyle=s.c; ctx.lineWidth=1.6; ctx.beginPath(); let on=false;
    for(const p of pts){ const v=p[s.k];
      if(v==null){on=false;continue;}
      on?ctx.lineTo(X(p.ts),Ys(v)):(ctx.moveTo(X(p.ts),Ys(v)),on=true);
    }
    ctx.stroke();
  } }
  ctx.lineWidth=1;
  if(hoverX!=null&&pts.length>1){
    const ht=t0+(hoverX-L)/(w-L-R)*span;
    let np=pts[0]; for(const p of pts) if(Math.abs(p.ts-ht)<Math.abs(np.ts-ht)) np=p;
    const x=X(np.ts);
    ctx.strokeStyle='#3a424b'; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(x,T); ctx.lineTo(x,h-B); ctx.stroke(); ctx.setLineDash([]);
    const rows=ALL.filter(s=>vis[s.k]&&np[s.k]!=null);
    if(rows.length){
    for(const s of rows){ctx.fillStyle=s.c;ctx.beginPath();
      const yy=(s.k==='rx'||s.k==='tx')?Ys(np[s.k]):Y(np[s.k]);
      ctx.arc(x,yy,3,0,7);ctx.fill();}
    const hasSpd=rows.some(s=>s.k==='rx'||s.k==='tx');
    const bw=hasSpd?178:132, bh=18*(rows.length+1)+8;
    let bx=x+12; if(bx+bw>w-R)bx=x-12-bw;
    ctx.fillStyle='rgba(20,23,27,.95)'; ctx.strokeStyle='#2a3037';
    ctx.beginPath(); ctx.rect(bx,T+6,bw,bh); ctx.fill(); ctx.stroke();
    ctx.textAlign='left'; ctx.textBaseline='top';
    const hd=new Date(np.ts);
    ctx.fillStyle='#9aa4ae';
    ctx.fillText(p2(hd.getHours())+':'+p2(hd.getMinutes())+':'+p2(hd.getSeconds()),bx+8,T+12);
    rows.forEach((s,i)=>{
      const sfx=(s.k==='rx'||s.k==='tx')?' Мбит/с':(s.k==='cpu'||s.k==='ram'?'%':'°C');
      ctx.fillStyle=s.c;ctx.fillText(s.l,bx+8,T+30+i*18);
      ctx.fillStyle='#e8edf2';ctx.fillText(np[s.k]+sfx,bx+70,T+30+i*18);});
    }
  }
}
cv.addEventListener('mousemove',e=>{hoverX=e.clientX-cv.getBoundingClientRect().left;schedule();});
cv.addEventListener('mouseleave',()=>{hoverX=null;schedule();});
addEventListener('resize',schedule);
document.querySelectorAll('.wbtn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.wbtn').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); WIN=+b.dataset.w; schedule();
});

// Кликабельная легенда. Два клика подряд перед dblclick переключают
// состояние дважды и гасят друг друга — двойной клик применяется чисто.
document.querySelectorAll('.legend span[data-k]').forEach(el=>{
  const k=el.dataset.k; lgEls[k]=el;
  el.onclick=()=>{vis[k]=!vis[k];syncUI();saveVis();schedule();};
  el.ondblclick=()=>{
    const isSolo=vis[k]&&ALL.every(s=>s.k===k||!vis[s.k]);
    ALL.forEach(s=>vis[s.k]=isSolo?true:(s.k===k));
    syncUI();saveVis();schedule();
  };
});
document.querySelectorAll('.lggrp').forEach(el=>{
  const ks=GROUPS[el.dataset.g]; grpEls[el.dataset.g]=el;
  el.onclick=()=>{const any=ks.some(k=>vis[k]);
    ks.forEach(k=>vis[k]=!any); syncUI();saveVis();schedule();};
  el.ondblclick=()=>{
    const isSolo=ks.every(k=>vis[k])&&ALL.every(s=>ks.includes(s.k)||!vis[s.k]);
    ALL.forEach(s=>vis[s.k]=isSolo?true:ks.includes(s.k));
    syncUI();saveVis();schedule();
  };
});
const syncUI=()=>{
  ALL.forEach(s=>{if(lgEls[s.k])lgEls[s.k].classList.toggle('off',!vis[s.k])});
  for(const g in grpEls){const ks=GROUPS[g];
    grpEls[g].classList.toggle('off',ks.every(k=>!vis[k]));}
};
syncUI();

async function tick(){
  try{
    const r=await fetch('data.json?'+Date.now(),{cache:'no-store'});
    if(!r.ok)throw 0;
    const d=await r.json();
    $('dot').classList.remove('err');
    serverTime=parseDT(d.datetime); $('datetime').textContent=fmtDT(serverTime);

    const cpu=pi(d.cpu_pct), ram=pi(d.ram_pct),
          tcpu=pi(d.cpu_temp), t24=pi(d.g24_temp), t5=pi(d.g5_temp),
          rx=d.rx==null?null:+d.rx, tx=d.tx==null?null:+d.tx;

    if(cpu!=null){gauge('g_cpu',cpu); cpu>=85?$('g_cpu').style.stroke='#f85149'
      :cpu>=60?$('g_cpu').style.stroke='#e3b341':$('g_cpu').style.stroke='#4cc38a';
      $('v_cpu').textContent=cpu+'%'; $('lg_cpu').textContent=cpu+'%';}
    if(ram!=null){gauge('g_ram',ram); $('v_ram').textContent=ram+'%';
      $('lg_ram').textContent=ram+'%';}
    $('s_ram').textContent=d.ram;
    setBig('v_tcpu',tcpu); setBig('v_t24',t24); setBig('v_t5',t5);
    $('lg_tcpu').textContent=tcpu==null?'–':tcpu+'°';
    $('lg_t24').textContent =t24 ==null?'–':t24 +'°';
    $('lg_t5').textContent  =t5  ==null?'–':t5  +'°';
    $('lg_rx').textContent=fmtSpd(rx);
    $('lg_tx').textContent=fmtSpd(tx);

    $('i_model').textContent=d.model; $('i_os').textContent=d.os;
    $('i_cpu').textContent=d.cpu;     $('i_up').textContent=d.uptime;
    $('i_opkg').textContent=d.opkg;
    const sw=$('i_slotwrap');
    if(d.slot){sw.style.display='flex'; $('i_slot').textContent=d.slot;}
    else sw.style.display='none';

    if(cpu!=null||ram!=null||tcpu!=null||rx!=null||tx!=null){
      points.push({ts:Date.now(),cpu,ram,tcpu,t24,t5,rx,tx});
      if(points.length>MAX)points.splice(0,points.length-MAX);
      if(++pushN%20==0)save();
      schedule();
    }
  }catch(e){$('dot').classList.add('err');}
}
tick(); loadHist(); setInterval(tick,3000); schedule();
</script>
