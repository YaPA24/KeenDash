name: ShellCheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Код репозитория
        uses: actions/checkout@v4
      - name: Проверка shell-скриптов (ошибки и предупреждения)
        run: shellcheck -s sh -S warning $(git ls-files '*.sh')
