<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Система · Карточка</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cg fill='none' stroke='%232ea043' stroke-width='2' stroke-linecap='round'%3E%3Crect x='3' y='14' width='18' height='7' rx='2'/%3E%3Cpath d='M7 17.5h.01M10.5 17.5h.01M17 14V8'/%3E%3Cpath d='M14.5 5.5a3.5 3.5 0 0 1 5 0M12.5 3a6.5 6.5 0 0 1 9 0'/%3E%3C/g%3E%3C/svg%3E">
<meta name="theme-color" content="#0b0d10">
<style>
/* ========== ОБЩИЙ БЛОК: идентичен dash.html ========== */
:root{
  --bg:#0b0d10; --card:#14171b; --line:#23282e;
  --label:#79828c; --value:#e8edf2; --dim:#9aa4ae;
  --ok:#3fb950; --warn:#e3b341; --crit:#f85149;
  --mono:"JetBrains Mono","Cascadia Mono",Consolas,"Courier New",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{height:100%}
body{
  background:var(--bg);
  background-image:radial-gradient(1100px 550px at 20% -10%,#12161b 0%,var(--bg) 65%);
  color:var(--value);font-family:var(--mono);
  display:flex;align-items:flex-start;justify-content:flex-start;
  min-height:100%;padding:28px;
}
.wrap{width:100%;max-width:1200px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:38px;height:38px;border-radius:10px;background:#1b2026;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;flex:none}
header h1{font-size:17px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
nav{display:flex;gap:6px;margin-left:14px}
nav a{color:var(--dim);font-size:12px;text-decoration:none;border:1px solid var(--line);
  border-radius:8px;padding:4px 10px}
nav a:hover{color:var(--value);border-color:var(--dim)}
nav a.on{color:var(--value);border-color:var(--dim);background:#1a1f25}
.brand{margin-left:14px;flex:none;display:block;text-decoration:none}
.brand rect{fill:#1b2026;stroke:#3fb950;stroke-width:1.5;fill-opacity:0;stroke-opacity:0;
  transition:fill-opacity .25s,stroke-opacity .25s}
.brand:hover rect{fill-opacity:1;stroke-opacity:1}
.brand .w1{fill:var(--value);font-weight:700;letter-spacing:.04em;transition:fill .25s}
.brand .w2{fill:var(--ok);font-weight:700;letter-spacing:.04em;transition:fill .25s}
.brand:hover .w1{fill:#fff}
.brand:hover .w2{fill:#56d364}
.brand .pulse{stroke:var(--ok);transition:stroke .25s}
.brand:hover .pulse{stroke:#56d364}
.brand .gh{fill:var(--dim);transition:fill .25s}
.brand:hover .gh{fill:var(--value)}
.clock{margin-right:auto;display:flex;align-items:center;gap:9px;color:var(--dim);font-size:14px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);
  animation:pulse 2s ease-in-out infinite}
.dot.err{background:var(--crit);box-shadow:0 0 10px var(--crit);animation:none}
@keyframes pulse{50%{opacity:.35}}
.label{color:var(--label);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.val{font-size:15px;text-align:right;line-height:1.5}
.val .dim{color:var(--dim)}
.chip{display:inline-block;background:#1a1f25;border:1px solid var(--line);border-radius:9px;
  padding:3px 9px;font-size:11.5px;color:var(--dim)}
.chip b{font-weight:600;margin-left:6px;color:var(--value)}
.chip b.ok{color:var(--ok)} .chip b.warn{color:var(--warn)} .chip b.crit{color:var(--crit)}
/* ========== СПЕЦИФИКА КАРТОЧКИ ========== */
.card{width:100%;max-width:465px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:6px 26px 18px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;
  padding:14px 0;flex-wrap:wrap}
.row + .row{border-top:1px solid var(--line)}
.row .label{padding-top:3px}
.trow{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:2px 0 16px}
.trow + .row{border-top:1px solid var(--line)}
.trow .chip{padding:6px 14px;font-size:13.5px;border-radius:10px}
.trow .chip b{margin-left:8px;font-size:14.5px}
.chips{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:7px}
.mbar{display:block;width:170px;height:4px;margin:8px 0 0 auto;background:#22272d;
  border-radius:3px;overflow:hidden}
.mbar i{display:block;height:100%;width:0;background:var(--ok);border-radius:3px;
  transition:width .5s,background .5s}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3fb950"
           stroke-width="2" stroke-linecap="round">
        <rect x="2" y="14" width="20" height="7" rx="2"/>
        <path d="M6.5 17.5h.01M10 17.5h.01M17 14V8"/>
        <path d="M14.5 5.5a3.5 3.5 0 0 1 5 0M12.5 3a6.5 6.5 0 0 1 9 0"/>
      </svg>
    </div>
    <h1>Система</h1>
    <nav><a href="index.html" class="on">карточка</a><a href="dash.html">дашборд</a></nav>
    <a class="brand" href="https://github.com/YaPA24/KeenDash" target="_blank" rel="noopener"
       title="Открыть проект на GitHub">
      <svg width="150" height="38" viewBox="0 0 150 38">
        <rect x="0.75" y="0.75" width="148.5" height="36.5" rx="10.5"/>
        <text x="14" y="22" font-size="18" textLength="92" lengthAdjust="spacingAndGlyphs"><tspan class="w1">Keen</tspan><tspan class="w2">Dash</tspan></text>
        <path class="pulse" d="M14 28h28l4-6 5 10 4-8 3 4h48" fill="none"
              stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <g class="gh" transform="translate(120,11)">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
        </g>
      </svg>
    </a>
  </header>
    <div class="clock"><span class="dot" id="dot"></span><span id="datetime">--.--.---- --:--:--</span></div>

  <div class="card">
    <div class="row"><span class="label">Модель</span><span class="val" id="model">…</span></div>
    <div class="row"><span class="label">ОС</span><span class="val" id="os">…</span></div>
    <div class="row"><span class="label">CPU / Темп.</span><span class="val" id="cpu">…</span></div>
    <div class="trow">
      <span class="chip">Load<b id="cpuload">–</b></span>
      <span class="chip">CPU<b id="tcpu">–</b></span>
      <span class="chip">2.4G<b id="t24">–</b></span>
      <span class="chip">5G<b id="t5">–</b></span>
    </div>
    <div class="row"><span class="label">Память</span>
      <span class="val"><span id="ram">…</span><span class="mbar"><i id="rambar"></i></span></span></div>
    <div class="row"><span class="label">OPKG</span>
      <span class="val">
        <span class="chips"><span class="chip">Слот<b id="slot">–</b></span></span>
        <span id="opkg">…</span>
      </span>
    </div>
    <div class="row"><span class="label">Uptime</span><span class="val" id="uptime">…</span></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const p2=n=>String(n).padStart(2,'0');
const tclass=v=>{const n=parseInt(v,10);return isNaN(n)?'':(n>=80?'crit':n>=65?'warn':'ok')};
const lclass=v=>{const n=parseInt(v,10);return isNaN(n)?'':(n>=85?'crit':n>=60?'warn':'ok')};
let serverTime=null;
const fmtDT=d=>p2(d.getDate())+'.'+p2(d.getMonth()+1)+'.'+d.getFullYear()+' '
                   +p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds());
function parseDT(s){
  const [dd,mm,yy]=s.slice(0,10).split('.').map(Number);
  const [h,mi,se]=s.slice(11).split(':').map(Number);
  return new Date(yy,mm-1,dd,h,mi,se);
}
setInterval(()=>{if(serverTime){serverTime=new Date(serverTime.getTime()+1000);
  $('datetime').textContent=fmtDT(serverTime);}},1000);

async function tick(){
  try{
    const r=await fetch('data.json?'+Date.now(),{cache:'no-store'});
    if(!r.ok)throw 0;
    const d=await r.json();
    $('dot').classList.remove('err');
    serverTime=parseDT(d.datetime); $('datetime').textContent=fmtDT(serverTime);
    $('model').textContent=d.model;
    $('os').textContent=d.os;
    $('cpu').textContent=d.cpu;
    const le=$('cpuload');
    if(d.cpu_pct===''||d.cpu_pct==null){le.textContent='–';le.className='';}
    else{le.textContent=d.cpu_pct+'%';le.className=lclass(d.cpu_pct);}
    for(const [id,val] of [['t24',d.g24_temp],['t5',d.g5_temp],['tcpu',d.cpu_temp]]){
      const el=$(id);el.textContent=val;el.className=tclass(val);
    }
    $('ram').innerHTML=d.ram+' <span class="dim">('+d.ram_pct+'%)</span>';
    const pct=Math.min(100,parseInt(d.ram_pct,10)||0);
    const bar=$('rambar');
    bar.style.width=pct+'%';
    bar.style.background=pct>=90?'var(--crit)':pct>=75?'var(--warn)':'var(--ok)';
    $('opkg').textContent=d.opkg;
    $('slot').textContent=d.slot?d.slot:'–';
    $('uptime').textContent=d.uptime;
  }catch(e){$('dot').classList.add('err');}
}
tick(); setInterval(tick,3000);
</script>
</body>
</html>
