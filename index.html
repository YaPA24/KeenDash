Назначение: компактная карточка системы; унифицирована с dash.html

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Система · Карточка</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cg fill='none' stroke='%232ea043' stroke-width='2' stroke-linecap='round'%3E%3Crect x='3' y='14' width='18' height='7' rx='2'/%3E%3Cpath d='M7 17.5h.01M10.5 17.5h.01M17 14V8'/%3E%3Cpath d='M14.5 5.5a3.5 3.5 0 0 1 5 0M12.5 3a6.5 6.5 0 0 1 9 0'/%3E%3C/g%3E%3C/svg%3E">
<meta name="theme-color" content="#0b0d10">
<script>try{const t=localStorage.getItem('sysinfoTheme');
  document.documentElement.dataset.theme=t==='cudy'||t==='light'?t:''}catch(e){}</script>
<style>
/* ========== ОБЩИЙ БЛОК: идентичен dash.html ========== */
:root{
  --bg:#0b0d10; --card:#14171b; --line:#23282e;
  --label:#79828c; --value:#e8edf2; --dim:#9aa4ae;
  --ok:#3fb950; --warn:#e3b341; --crit:#f85149;
  --panel:#1b2026; --chipbg:#1a1f25; --track:#22272d;
  --shadow:0 20px 60px rgba(0,0,0,.45);
  --grid-minor:#1c2126; --grid-zero:#2a3037; --axis:#525b64;
  --tick:#242a31; --tick-lbl:#3d4650; --hover:#3a424b;
  --tip-bg:rgba(20,23,27,.95); --tip-border:#2a3037;
  --mono:"JetBrains Mono","Cascadia Mono",Consolas,"Courier New",monospace;
}
/* Тема «cudy» — глубокий сине-чёрный вариант (пример: cudy-monitor-pro).
   Выбирается в меню кнопки «тема» (строка времени); выбор хранится в localStorage. */
html[data-theme="cudy"]{
  --bg:#060d1a; --card:#0d1b31; --line:#28405d;
  --label:#7e94b4; --value:#edf7ff; --dim:#a1b0c9;
  --ok:#00d58d; --warn:#ffb566; --crit:#f85149;
  --panel:#111b2d; --chipbg:#14233f; --track:#1e3350;
  --shadow:0 20px 60px rgba(2,8,20,.55);
  --grid-minor:#15233c; --grid-zero:#2a4066; --axis:#6e84a4;
  --tick:#1d3050; --tick-lbl:#556c8e; --hover:#3d5a85;
  --tip-bg:rgba(9,18,35,.95); --tip-border:#2a4066;
}
html[data-theme="cudy"] body{background-image:radial-gradient(1100px 550px at 65% -10%,#1b3460 0%,var(--bg) 65%)}
html[data-theme="cudy"] .card,html[data-theme="cudy"] .tile,
html[data-theme="cudy"] .chartcard,html[data-theme="cudy"] .info div{
  background:linear-gradient(140deg,#142440,var(--card) 60%)}
/* Тема «light» — светлая; тёмная остаётся дефолтом без изменений. */
html[data-theme="light"]{
  --bg:#eef1f5; --card:#ffffff; --line:#d5dbe3;
  --label:#69737f; --value:#1b222b; --dim:#5c6672;
  --ok:#1a7f37; --warn:#9a6700; --crit:#cf222e;
  --panel:#e6eaf0; --chipbg:#f1f4f8; --track:#e1e6ec;
  --shadow:0 20px 60px rgba(35,45,60,.14);
  --grid-minor:#e8ecf1; --grid-zero:#d0d7df; --axis:#7a8592;
  --tick:#dfe5eb; --tick-lbl:#9aa3ad; --hover:#c6ced8;
  --tip-bg:rgba(255,255,255,.96); --tip-border:#d0d7df;
}
html[data-theme="light"] body{background-image:radial-gradient(1100px 550px at 20% -10%,#e4e9ef 0%,var(--bg) 65%)}
*{margin:0;padding:0;box-sizing:border-box}
html{height:100%}
body{
  background:var(--bg);
  background-image:radial-gradient(1100px 550px at 20% -10%,#12161b 0%,var(--bg) 65%);
  color:var(--value);font-family:var(--mono);
  display:flex;align-items:flex-start;justify-content:flex-start;
  min-height:100%;padding:28px;
}
.wrap{width:100%;max-width:1200px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:38px;height:38px;border-radius:10px;background:var(--panel);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;flex:none}
header h1{font-size:17px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
nav{display:flex;gap:6px;margin-left:14px}
nav a{color:var(--dim);font-size:12px;text-decoration:none;border:1px solid var(--line);
  border-radius:8px;padding:4px 10px}
nav a:hover{color:var(--value);border-color:var(--dim)}
nav a.on{color:var(--value);border-color:var(--dim);background:var(--chipbg)}
.theme{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;
  background:transparent;border:1px solid var(--line);border-radius:8px;cursor:pointer;
  color:var(--dim);font-family:var(--mono);font-size:12px}
.theme:hover{color:var(--value);border-color:var(--dim)}
.theme svg{display:block}
/* Меню темы: светлая / тёмная / cudy + ползунок «гамма» (поворот оттенка) */
.thwrap{position:relative;display:inline-flex}
.tmenu{position:absolute;z-index:30;top:calc(100% + 6px);left:0;min-width:212px;
  max-width:calc(100vw - 20px);background:var(--card);border:1px solid var(--line);
  border-radius:10px;box-shadow:var(--shadow);padding:6px;display:none;
  flex-direction:column;gap:2px}
.tmenu.open{display:flex}
.tmi{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;
  border:0;border-radius:7px;padding:7px 9px;color:var(--dim);cursor:pointer;
  font-family:var(--mono);font-size:12px}
.tmi:hover{background:var(--chipbg);color:var(--value)}
.tmi.on{color:var(--value)}
.tmi.on::after{content:"✓";margin-left:auto;color:var(--ok);font-weight:700}
.tmi .sw{width:14px;height:14px;border-radius:4px;border:1px solid var(--line);flex:none}
.tmi .sw.light{background:#eef1f5}
.tmi .sw.dark{background:#14171b}
.tmi .sw.cudy{background:#0d1b31}
.tsep{height:1px;background:var(--line);margin:5px 3px}
.tgamma{display:flex;align-items:center;gap:8px;padding:4px 9px 6px;
  color:var(--dim);font-size:11.5px}
.tgamma input{flex:1;min-width:0;accent-color:var(--ok);cursor:pointer}
.tgamma b{min-width:34px;text-align:right;color:var(--value);font-weight:600}
.tgamma .hx{width:20px;height:20px;flex:none;border:1px solid var(--line);border-radius:6px;
  background:transparent;color:var(--dim);cursor:pointer;font-family:var(--mono);
  font-size:12px;line-height:1;padding:0}
.tgamma .hx:hover{color:var(--value);border-color:var(--dim)}
@media (max-width:560px){.tmenu{left:auto;right:0}}
.brand{margin-left:14px;flex:none;display:block;text-decoration:none}
.brand rect{fill:var(--panel);stroke:#3fb950;stroke-width:1.5;fill-opacity:0;stroke-opacity:0;
  transition:fill-opacity .25s,stroke-opacity .25s}
.brand:hover rect{fill-opacity:1;stroke-opacity:1}
.brand .w1{fill:var(--value);font-weight:700;letter-spacing:.04em;transition:fill .25s}
.brand .w2{fill:var(--ok);font-weight:700;letter-spacing:.04em;transition:fill .25s}
.brand:hover .w1{fill:#fff}
.brand:hover .w2{fill:#56d364}
.brand .pulse{stroke:var(--ok);transition:stroke .25s}
.brand:hover .pulse{stroke:#56d364}
.brand .gh{fill:var(--dim);transition:fill .25s}
.brand:hover .gh{fill:var(--value)}
.clock{display:flex;align-items:center;gap:9px;color:var(--dim);font-size:14px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);
  animation:pulse 2s ease-in-out infinite}
.dot.err{background:var(--crit);box-shadow:0 0 10px var(--crit);animation:none}
@keyframes pulse{50%{opacity:.35}}
.label{color:var(--label);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.val{font-size:15px;text-align:right;line-height:1.5}
.val .dim{color:var(--dim)}
.chip{display:inline-block;background:var(--chipbg);border:1px solid var(--line);border-radius:9px;
  padding:3px 9px;font-size:11.5px;color:var(--dim)}
.chip b{font-weight:600;margin-left:6px;color:var(--value)}
.chip b.ok{color:var(--ok)} .chip b.warn{color:var(--warn)} .chip b.crit{color:var(--crit)}
/* ========== СПЕЦИФИКА КАРТОЧКИ ========== */
.card{width:100%;max-width:465px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:6px 26px 18px;box-shadow:var(--shadow)}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;
  padding:14px 0;flex-wrap:wrap}
.row + .row{border-top:1px solid var(--line)}
.row .label{padding-top:3px}
.trow{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:2px 0 16px}
.trow + .row{border-top:1px solid var(--line)}
.trow .chip{padding:6px 14px;font-size:13.5px;border-radius:10px}
.trow .chip b{margin-left:8px;font-size:14.5px}
.chips{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:7px}
.mbar{display:block;width:170px;height:4px;margin:8px 0 0 auto;background:var(--track);
  border-radius:3px;overflow:hidden}
.mbar i{display:block;height:100%;width:0;background:var(--ok);border-radius:3px;
  transition:width .5s,background .5s}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3fb950"
           stroke-width="2" stroke-linecap="round">
        <rect x="2" y="14" width="20" height="7" rx="2"/>
        <path d="M6.5 17.5h.01M10 17.5h.01M17 14V8"/>
        <path d="M14.5 5.5a3.5 3.5 0 0 1 5 0M12.5 3a6.5 6.5 0 0 1 9 0"/>
      </svg>
    </div>
    <h1>Система</h1>
    <nav><a href="index.html" class="on">карточка</a><a href="dash.html">дашборд</a></nav>
    <a class="brand" href="https://github.com/YaPA24/KeenDash" target="_blank" rel="noopener"
       title="Открыть проект на GitHub">
      <svg width="150" height="38" viewBox="0 0 150 38">
        <rect x="0.75" y="0.75" width="148.5" height="36.5" rx="10.5"/>
        <text x="14" y="22" font-size="18" textLength="92" lengthAdjust="spacingAndGlyphs"><tspan class="w1">Keen</tspan><tspan class="w2">Dash</tspan></text>
        <path class="pulse" d="M14 28h28l4-6 5 10 4-8 3 4h48" fill="none"
              stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <g class="gh" transform="translate(120,11)">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
        </g>
      </svg>
    </a>
  </header>
  <div class="clock"><span class="dot" id="dot"></span><span id="datetime">--.--.---- --:--:--</span>
    <div class="thwrap">
      <button class="theme" id="themeBtn" title="Выбор темы" aria-haspopup="menu" aria-expanded="false">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.75" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7 1.25a5.75 5.75 0 0 1 0 11.5z" fill="currentColor"/></svg>тема</button>
      <div class="tmenu" id="tmenu" role="menu">
        <button class="tmi" data-th="light"><i class="sw light"></i>Светлая</button>
        <button class="tmi" data-th=""><i class="sw dark"></i>Тёмная</button>
        <button class="tmi" data-th="cudy"><i class="sw cudy"></i>Cudy</button>
        <div class="tsep"></div>
        <div class="tgamma"><span>Гамма</span>
          <input type="range" id="hueR" min="0" max="360" step="5" value="0" title="Поворот оттенка страницы">
          <b id="hueV">0°</b>
          <button class="hx" id="hueX" title="Сбросить гамму">×</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="row"><span class="label">Модель</span><span class="val" id="model">…</span></div>
    <div class="row"><span class="label">ОС</span><span class="val" id="os">…</span></div>
    <div class="row"><span class="label">CPU / Темп.</span><span class="val" id="cpu">…</span></div>
    <div class="trow">
      <span class="chip">Load<b id="cpuload">–</b></span>
      <span class="chip">CPU<b id="tcpu">–</b></span>
      <span class="chip">2.4G<b id="t24">–</b></span>
      <span class="chip">5G<b id="t5">–</b></span>
    </div>
    <div class="row"><span class="label">Память</span>
      <span class="val"><span id="ram">…</span><span class="mbar"><i id="rambar"></i></span></span></div>
    <div class="row"><span class="label">OPKG</span>
      <span class="val">
        <span class="chips"><span class="chip">Слот<b id="slot">–</b></span></span>
        <span id="opkg">…</span>
      </span>
    </div>
    <div class="row"><span class="label">Uptime</span><span class="val" id="uptime">…</span></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const p2=n=>String(n).padStart(2,'0');
const tclass=v=>{const n=parseInt(v,10);return isNaN(n)?'':(n>=80?'crit':n>=65?'warn':'ok')};
const lclass=v=>{const n=parseInt(v,10);return isNaN(n)?'':(n>=85?'crit':n>=60?'warn':'ok')};
let serverTime=null;
const fmtDT=d=>p2(d.getDate())+'.'+p2(d.getMonth()+1)+'.'+d.getFullYear()+' '
                   +p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds());
function parseDT(s){
  const [dd,mm,yy]=s.slice(0,10).split('.').map(Number);
  const [h,mi,se]=s.slice(11).split(':').map(Number);
  return new Date(yy,mm-1,dd,h,mi,se);
}
setInterval(()=>{if(serverTime){serverTime=new Date(serverTime.getTime()+1000);
  $('datetime').textContent=fmtDT(serverTime);}},1000);

async function tick(){
  try{
    const r=await fetch('data.json?'+Date.now(),{cache:'no-store'});
    if(!r.ok)throw 0;
    const d=await r.json();
    $('dot').classList.remove('err');
    serverTime=parseDT(d.datetime); $('datetime').textContent=fmtDT(serverTime);
    $('model').textContent=d.model;
    $('os').textContent=d.os;
    $('cpu').textContent=d.cpu;
    const le=$('cpuload');
    if(d.cpu_pct===''||d.cpu_pct==null){le.textContent='–';le.className='';}
    else{le.textContent=d.cpu_pct+'%';le.className=lclass(d.cpu_pct);}
    for(const [id,val] of [['t24',d.g24_temp],['t5',d.g5_temp],['tcpu',d.cpu_temp]]){
      const el=$(id);el.textContent=val;el.className=tclass(val);
    }
    $('ram').innerHTML=d.ram+' <span class="dim">('+d.ram_pct+'%)</span>';
    const pct=Math.min(100,parseInt(d.ram_pct,10)||0);
    const bar=$('rambar');
    bar.style.width=pct+'%';
    bar.style.background=pct>=90?'var(--crit)':pct>=75?'var(--warn)':'var(--ok)';
    $('opkg').textContent=d.opkg;
    $('slot').textContent=d.slot?d.slot:'–';
    $('uptime').textContent=d.uptime;
  }catch(e){$('dot').classList.add('err');}
}
tick(); setInterval(tick,3000);

// Тема: кнопка в строке времени (за часами) открывает меню — светлая / тёмная /
// cudy — и ползунок «гамма» (поворот оттенка страницы). Тема и гамма запоминаются
// в localStorage; тема применяется до отрисовки скриптом в <head>.
const THEMES={'':'#0b0d10',cudy:'#060d1a',light:'#f5f7fa'};
const applyTheme=t=>{document.documentElement.dataset.theme=t;
  const m=document.querySelector('meta[name="theme-color"]');
  if(m)m.content=THEMES[t]||THEMES[''];};
const btn=document.getElementById('themeBtn'),menu=document.getElementById('tmenu'),
      hueR=document.getElementById('hueR'),hueV=document.getElementById('hueV');
let hue=0;try{hue=parseInt(localStorage.getItem('sysinfoHue'),10)||0}catch(e){}
hue=((hue%360)+360)%360;
const applyHue=h=>{document.body.style.filter=h?'hue-rotate('+h+'deg)':'';};
const syncMenu=()=>document.querySelectorAll('.tmi').forEach(el=>
  el.classList.toggle('on',el.dataset.th===(document.documentElement.dataset.theme||'')));
const closeMenu=()=>{menu.classList.remove('open');
  btn.setAttribute('aria-expanded','false');};
btn.onclick=e=>{e.stopPropagation();menu.classList.toggle('open');
  btn.setAttribute('aria-expanded',menu.classList.contains('open'));};
document.addEventListener('click',e=>{if(menu.classList.contains('open')
  &&!menu.contains(e.target))closeMenu();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();});
document.querySelectorAll('.tmi').forEach(el=>el.onclick=()=>{
  const t=el.dataset.th||'';
  try{localStorage.setItem('sysinfoTheme',t)}catch(e){}
  applyTheme(t);syncMenu();closeMenu();});
hueR.oninput=()=>{hue=+hueR.value;hueV.textContent=hue+'°';applyHue(hue);
  try{localStorage.setItem('sysinfoHue',hue)}catch(e){}};
document.getElementById('hueX').onclick=()=>{hue=0;hueR.value=0;
  hueV.textContent='0°';applyHue(0);
  try{localStorage.setItem('sysinfoHue',0)}catch(e){}};
applyTheme(document.documentElement.dataset.theme||'');
applyHue(hue);hueR.value=hue;hueV.textContent=hue+'°';syncMenu();
</script>
</body>
</html>
